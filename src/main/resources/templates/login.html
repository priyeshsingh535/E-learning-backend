<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Font Awesome for the login icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .login-container i {
            font-size: 50px;
            color: #5b9bd5;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            color: #333;
        }

        .input-field:focus {
            outline: none;
            border-color: #5b9bd5;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: #5b9bd5;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #4178a7;
        }

        .footer {
            margin-top: 15px;
        }

        .footer a {
            color: #5b9bd5;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="login-container">
    <!-- Login Icon -->
    <i class="fas fa-user-circle"></i>

    <h2>Login</h2>

    <!-- Form -->
    <form th:action="@{'/client-login-process'}" method="POST">
        <input type="text" name="username" class="input-field" placeholder="Username" required>
        <input type="password" name="userpassword" class="input-field" placeholder="Password" required>
        <button type="submit" class="login-btn">Login</button>
    </form>

    <!-- Footer with password recovery link -->
    <div class="footer">
        <p>Forgot your password? <a href="#">Click here</a></p>
    </div>
</div>

</body>
</html>
